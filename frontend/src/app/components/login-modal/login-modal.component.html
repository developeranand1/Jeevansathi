<div class="modal-backdrop-custom d-flex align-items-center justify-content-center p-2 p-md-3">
  <div class="modal-content-custom bg-white rounded-4 shadow-lg overflow-hidden border border-warning border-opacity-50 animate-scale-in">
    <!-- Header -->
    <div class="modal-header-custom p-3 text-white d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-box-arrow-in-right text-warning fs-4"></i>
        <div>
          <h5 class="mb-0 fw-bold font-serif text-white">Login to Vivah (विवाह लॉगिन)</h5>
          <span class="small text-warning">Access your shortlisted matches & biodatas</span>
        </div>
      </div>
      <button type="button" class="btn btn-close-custom text-white" (click)="close.emit()">
        <i class="bi bi-x-lg fs-5"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-4">
      <!-- Login Mode Tabs -->
      <div class="d-flex p-1 bg-light rounded-pill mb-4 border">
        <button
          type="button"
          class="btn btn-sm rounded-pill flex-grow-1"
          [class.btn-royal-primary]="loginMode() === 'otp'"
          (click)="loginMode.set('otp')"
        >
          <i class="bi bi-phone me-1"></i> Mobile with OTP
        </button>
        <button
          type="button"
          class="btn btn-sm rounded-pill flex-grow-1"
          [class.btn-royal-primary]="loginMode() === 'password'"
          (click)="loginMode.set('password')"
        >
          <i class="bi bi-key me-1"></i> ID & Password
        </button>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label small fw-semibold">
            {{ loginMode() === 'otp' ? 'Registered Mobile Number' : 'Matrimony ID or Email' }}
          </label>
          <div class="input-group">
            @if (loginMode() === 'otp') {
              <span class="input-group-text bg-light">+91</span>
            }
            <input
              type="text"
              class="form-control form-control-royal"
              formControlName="mobileOrEmail"
              placeholder="Enter mobile or email"
            />
          </div>
        </div>

        @if (loginMode() === 'otp') {
          @if (!otpSent()) {
            <button type="button" class="btn btn-outline-warning text-dark w-100 py-2 mb-3" (click)="sendOtp()">
              <i class="bi bi-send-fill me-1"></i> Send One-Time Password (OTP)
            </button>
          } @else {
            <div class="mb-3">
              <label class="form-label small fw-semibold">Enter 4-Digit OTP</label>
              <input
                type="text"
                class="form-control form-control-royal font-monospace text-center fs-5 letter-spacing-2"
                formControlName="otp"
                placeholder="• • • •"
                maxlength="6"
              />
              <div class="d-flex justify-content-between align-items-center mt-1 small">
                <span class="text-success"><i class="bi bi-check2"></i> Demo code applied (7721)</span>
                <a href="javascript:void(0)" class="text-muted text-decoration-none" (click)="sendOtp()">Resend OTP</a>
              </div>
            </div>

            <button type="submit" class="btn btn-royal-gold w-100 py-2 fs-6">
              <i class="bi bi-shield-lock-fill me-1"></i> Verify & Sign In
            </button>
          }
        } @else {
          <!-- Password Mode -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input
              type="password"
              class="form-control form-control-royal"
              formControlName="password"
              placeholder="••••••••"
            />
          </div>

          <button type="submit" class="btn btn-royal-gold w-100 py-2 fs-6">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
          </button>
        }
      </form>

      <!-- Register Prompt -->
      <div class="text-center mt-4 pt-3 border-top small">
        <span class="text-muted">New to Vivah Matrimony? </span>
        <a href="javascript:void(0)" class="text-danger fw-bold text-decoration-none" (click)="openRegister.emit(); close.emit()">
          Register Free Today
        </a>
      </div>
    </div>
  </div>
</div>
